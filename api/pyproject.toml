[project]
name = "controle-producao-api"
version = "0.2.0"
description = "Fundacao PostgreSQL da API REST do Controle de Producao Industel."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "SQLAlchemy>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
]
