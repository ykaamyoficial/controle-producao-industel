services:
  postgres:
    image: postgres:16
    container_name: controle_producao_postgres_dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_producao_dev}
      POSTGRES_USER: ${POSTGRES_USER:-controle_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controle_dev}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: controle_producao_api_dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-controle_dev}:${POSTGRES_PASSWORD:-controle_dev}@postgres:5432/${POSTGRES_DB:-controle_producao_dev}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-10}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_POOL_RECYCLE: ${DATABASE_POOL_RECYCLE:-1800}
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      SECRET_KEY: ${SECRET_KEY:-controle-producao-api-dev-secret-key-2026}
      PROVISIONING_SECRET: ${PROVISIONING_SECRET:-dev-provisioning-secret-change-me-32chars}
      OPERATIONAL_INSTANCE_ID: ${OPERATIONAL_INSTANCE_ID:-}
      OPERATIONAL_COMPANY_ID: ${OPERATIONAL_COMPANY_ID:-}
      OPERATIONAL_COMPANY_CODE: ${OPERATIONAL_COMPANY_CODE:-local-dev}
      OPERATIONAL_COMPANY_NAME: ${OPERATIONAL_COMPANY_NAME:-Empresa Local}
      OPERATIONAL_ENVIRONMENT_TYPE: ${OPERATIONAL_ENVIRONMENT_TYPE:-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-10}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      NOMUS_ENCRYPTION_KEY: ${NOMUS_ENCRYPTION_KEY:-dev-nomus-encryption-key-change-me}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app/api
    command: python -m uvicorn api.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_dev_data:
