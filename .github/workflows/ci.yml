name: CI

# Fase 09, Secao 6: CI e independente do deploy -- roda em todo push de branch
# e em todo Pull Request, mas NUNCA em push de tag (o pipeline de release/producao
# vive em release-server.yml, disparado apenas por tag/workflow_dispatch).
# Nenhum secret de producao e referenciado neste workflow (Secao 10).
"on":
  push:
    branches: ["**"]
  pull_request:

# Minimo necessario para checkout + rodar testes (Secao 10). packages/deployments
# nunca sao concedidos aqui.
permissions:
  contents: read

# CI e independente do lock de producao (production-deploy, ver release-server.yml):
# varios PRs/branches podem rodar CI em paralelo sem qualquer risco, ja que este
# workflow nunca toca infraestrutura real.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: test
  # Valor fixo somente para os testes: nao e um secret de producao (Secao 10 --
  # "secrets de producao nao devem ficar disponiveis nos jobs de CI que rodam
  # codigo de PR"), apenas uma chave descartavel exigida pelo proprio validador
  # de configuracao (Settings.auth_ready) para os testes de readiness passarem.
  SECRET_KEY: ci-only-disposable-secret-key-not-for-production-use
  POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://controle_ci:controle_ci@localhost:5432/controle_producao_test
  DATABASE_URL: postgresql+asyncpg://controle_ci:controle_ci@localhost:5432/controle_producao_test
  QT_QPA_PLATFORM: offscreen

jobs:
  test:
    name: Lint, validacoes e suite completa
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: controle_ci
          POSTGRES_PASSWORD: controle_ci
          POSTGRES_DB: controle_producao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U controle_ci -d controle_producao_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias de sistema para testes Qt headless
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libnss3

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r api/requirements-dev.txt
          pip install pyyaml

      - name: Validar sintaxe dos workflows (Secao 27)
        run: |
          python -c "
          import pathlib, sys, yaml
          errors = []
          for path in sorted(pathlib.Path('.github/workflows').glob('*.yml')):
              try:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              except yaml.YAMLError as exc:
                  errors.append(f'{path}: {exc}')
          if errors:
              print(chr(10).join(errors)); sys.exit(1)
          print('YAMLs de workflow validos.')
          "

      - name: Checksums de migrations (imutabilidade -- Fase 04)
        run: python scripts/check_migration_checksums.py

      - name: Classificacao de risco de migrations (Fase 04)
        run: python scripts/check_migration_safety.py

      - name: Suite completa de testes (Desktop + API)
        run: python -m pytest -q --ignore=tests/test_notification_center_dialog.py
